name: archlint-comment

# Posts the archlint scan report as a PR comment.
#
# Split out from `ci.yml` (#514): `pull_request` events fired from forks
# carry a read-only GITHUB_TOKEN, so the inline comment step 403'd on every
# fork PR even when the scan passed. `workflow_run` events always run on
# the base repo with full write permissions, regardless of where the PR
# originated. See:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    # Only act on PR-triggered CI runs that produced an artifact. `success`
    # and `failure` both leave the artifact in place; we still want to post
    # the report if a downstream step failed for an unrelated reason.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Download archlint report artifact
        uses: actions/download-artifact@v4
        with:
          name: archlint-report
          path: /tmp/archlint-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve PR number
        id: pr
        run: |
          if [ ! -f /tmp/archlint-artifact/pr_number.txt ]; then
            echo "no pr_number.txt in artifact — nothing to comment on" >&2
            exit 0
          fi
          PR=$(cat /tmp/archlint-artifact/pr_number.txt | tr -d '[:space:]')
          if [ -z "$PR" ]; then
            echo "pr_number.txt is empty — nothing to comment on" >&2
            exit 0
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

      - name: Post or update archlint comment
        if: steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.pr.outputs.pr_number }}', 10);
            const report = fs.readFileSync('/tmp/archlint-artifact/report.md', 'utf8');
            const body = `${report}\n\n---\n*Generated by [archlint-rs](https://github.com/mshogin/archlint)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.body.includes('## Architecture scan') && c.user.type === 'Bot'
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
